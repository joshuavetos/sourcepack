name: Hardening Software Validation

on:
  pull_request:
    branches: [hardening-v1]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose-policy-strengthening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Reproduce strengthening payload
        shell: bash
        run: |
          set -e
          work=$(mktemp -d)
          repo="$work/repo"
          mkdir -p "$repo/.sourcepack"
          git -C "$repo" init
          git -C "$repo" config user.email test@example.com
          git -C "$repo" config user.name 'Test User'
          printf '%s' '{"schema_version":"sourcepack.policy.v1","rules":{"block_dependency_additions":true}}' > "$repo/.sourcepack/policy.json"
          printf '%s' '{"schema_version":"sourcepack.org_policy.v1","policy_id":"engineering-default","rules":{"block_dependency_additions":false}}' > "$work/org.json"
          set +e
          python -m sourcepack.cli policy resolve "$repo" --json --org-policy "$work/org.json" > policy-payload.json 2> policy-stderr.txt
          status=$?
          set -e
          echo "$status" > policy-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: policy-strengthening-diagnostic
          path: |
            policy-payload.json
            policy-stderr.txt
            policy-status.txt
