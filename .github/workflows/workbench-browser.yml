name: Workbench browser gate

on:
  pull_request:
    paths:
      - pyproject.toml
      - src/sourcepack/workbench.py
      - src/sourcepack/command_center.py
      - src/sourcepack/command_center_endpoint.py
      - src/sourcepack/workbench_static/**
      - tests/test_workbench_browser.py
      - .github/workflows/workbench-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium accessibility and responsive layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SourcePack browser-test dependencies
        run: python -m pip install -e '.[browser-test]'
      - name: Install pinned Playwright Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Run headless Workbench browser gate
        run: python -m pytest -q tests/test_workbench_browser.py
